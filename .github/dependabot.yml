version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    ignore:
      # Node is upgraded by hand, LTS only (ARCHITECTURE.md D16); the types follow the runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      testing:
        patterns:
          - "vitest"
          - "jsdom"
          - "@testing-library/*"
      biome:
        patterns:
          - "@biomejs/*"
      fastify:
        patterns:
          - "fastify"
          - "@fastify/*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Only LTS (even) majors of Node; the upgrade to a new LTS is done by hand (D16).
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
